<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="sig-title sig-desc">
  <title id="sig-title">Sig, the Distilling Significance mascot</title>
  <desc id="sig-desc">A cute blue droplet with big shiny eyes and a smile on a blue tile; its tip is a glowing node where a small network converges, like the project logo.</desc>
  <defs>
    <linearGradient id="sig-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F45"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="sig-body" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#E0F2FE"/>
      <stop offset=".45" stop-color="#93C5FD"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <radialGradient id="sig-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#67E8F9" stop-opacity=".45"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sig-node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#67E8F9" stop-opacity=".7"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sig-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.2" fill="#93C5FD" opacity=".25"/>
    </pattern>
  </defs>
  <rect width="200" height="200" rx="44" fill="url(#sig-bg)"/>
  <rect width="200" height="200" rx="44" fill="url(#sig-grid)"/>
  <g fill="none" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" opacity=".55">
    <path d="M22 42 V22 H42"/>
    <path d="M158 22 H178 V42"/>
    <path d="M178 158 V178 H158"/>
    <path d="M42 178 H22 V158"/>
  </g>
  <circle cx="100" cy="128" r="74" fill="url(#sig-glow)"/>
  <g stroke="#60A5FA" stroke-width="2" opacity=".65">
    <line x1="64" y1="30" x2="100" y2="58"/>
    <line x1="100" y1="22" x2="100" y2="58"/>
  </g>
  <line x1="136" y1="30" x2="100" y2="58" stroke="#22D3EE" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="64" cy="30" r="5" fill="#DBEAFE"/>
  <circle cx="100" cy="22" r="5" fill="#DBEAFE"/>
  <circle cx="136" cy="30" r="5" fill="#22D3EE"/>
  <path d="M100 58 C114 80 150 102 150 128 A50 50 0 0 1 50 128 C50 102 86 80 100 58 Z" fill="url(#sig-body)" stroke="#22D3EE" stroke-width="3.5" stroke-linejoin="round"/>
  <ellipse cx="75" cy="112" rx="7" ry="13" transform="rotate(28 75 112)" fill="#fff" opacity=".75"/>
  <ellipse cx="82" cy="131" rx="10.5" ry="13" fill="#0B1F45"/>
  <ellipse cx="118" cy="131" rx="10.5" ry="13" fill="#0B1F45"/>
  <circle cx="85.5" cy="126" r="4.2" fill="#fff"/>
  <circle cx="121.5" cy="126" r="4.2" fill="#fff"/>
  <circle cx="79" cy="136" r="1.8" fill="#A5F3FC"/>
  <circle cx="115" cy="136" r="1.8" fill="#A5F3FC"/>
  <ellipse cx="66" cy="150" rx="8" ry="5" fill="#F9A8D4" opacity=".6"/>
  <ellipse cx="134" cy="150" rx="8" ry="5" fill="#F9A8D4" opacity=".6"/>
  <path d="M92 151 Q100 159 108 151" fill="none" stroke="#0B1F45" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="100" cy="58" r="16" fill="url(#sig-node-glow)"/>
  <circle cx="100" cy="58" r="7.5" fill="#22D3EE" stroke="#E0F2FE" stroke-width="2.5"/>
  <circle cx="97.6" cy="55.6" r="2.2" fill="#fff" opacity=".9"/>
</svg>
