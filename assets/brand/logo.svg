<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">distilling-significance logo</title>
  <desc id="logo-desc">A layered network on a blue tile: many input nodes converge through a hidden layer into one glowing output node, along one traced path. Significance, distilled.</desc>
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F45"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="logo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#67E8F9" stop-opacity=".6"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="logo-grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="0.9" fill="#93C5FD" opacity=".25"/>
    </pattern>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#logo-bg)"/>
  <rect width="128" height="128" rx="28" fill="url(#logo-grid)"/>
  <g stroke="#60A5FA" stroke-width="1.4" opacity=".45">
    <line x1="24" y1="30" x2="40" y2="62"/>
    <line x1="24" y1="30" x2="64" y2="62"/>
    <line x1="24" y1="30" x2="88" y2="62"/>
    <line x1="44" y1="30" x2="40" y2="62"/>
