    <line x1="64" y1="30" x2="88" y2="62"/>
    <line x1="84" y1="30" x2="40" y2="62"/>
    <line x1="84" y1="30" x2="64" y2="62"/>
    <line x1="84" y1="30" x2="88" y2="62"/>
    <line x1="104" y1="30" x2="40" y2="62"/>
    <line x1="104" y1="30" x2="64" y2="62"/>
    <line x1="104" y1="30" x2="88" y2="62"/>
  </g>
  <g stroke="#93C5FD" stroke-width="1.8" opacity=".65">
